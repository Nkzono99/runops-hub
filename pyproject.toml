[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runops-hub"
version = "0.1.0"
description = "An agent workspace for managing multiple runops simulation projects"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Nkzono99/runops-hub"
Issues = "https://github.com/Nkzono99/runops-hub/issues"

[project.scripts]
runops-hub = "runops_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runops_hub"]

[tool.hatch.build.targets.wheel.force-include]
"hub" = "runops_hub/_runtime/hub"
"lib/board.py" = "runops_hub/_runtime/lib/board.py"
"lib/projects.py" = "runops_hub/_runtime/lib/projects.py"
"lib/relink.py" = "runops_hub/_runtime/lib/relink.py"
"lib/sessions.py" = "runops_hub/_runtime/lib/sessions.py"
"lib/status.py" = "runops_hub/_runtime/lib/status.py"
"templates/AGENTS.md" = "runops_hub/_runtime/templates/AGENTS.md"
"templates/member_section.md" = "runops_hub/_runtime/templates/member_section.md"
"LICENSE" = "runops_hub/_runtime/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["/src", "/hub", "/lib/*.py", "/templates", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
